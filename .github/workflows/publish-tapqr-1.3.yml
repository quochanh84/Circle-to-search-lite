name: Publish TapQR 1.3 download
on:
  push:
    branches: ['tapqr-1.3-wincare']
    paths: ['.github/workflows/publish-tapqr-1.3.yml']
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Publish existing APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api "repos/$GH_REPO/actions/artifacts/14732131692/zip" > build.zip
          echo '5a7a1fe82c2f6dc78b2e1c14dd5a55893f7c55c12956f57580bd8282f2b97ab3  build.zip' | sha256sum -c -
          unzip -p build.zip TapQR.apk > TapQR-1.3-WinCare.apk
          gh release create v1.3-wincare TapQR-1.3-WinCare.apk --target 09383c23ed089ee64c33ac003bf479fe9ee55481 --title 'TapQR 1.3 WinCare' --notes 'Installable Android debug APK for the WinCare 3.6 store QR flow.'
