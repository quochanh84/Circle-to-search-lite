name: Build TapQR APK
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: gradle :app:assembleDebug
      - run: |
          apk=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest print "$apk" > /tmp/tapqr-manifest.xml
          test "$(grep -c '<service' /tmp/tapqr-manifest.xml)" -eq 1
          grep -q 'AutoQrService' /tmp/tapqr-manifest.xml
          cp "$apk" TapQR.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TapQR
          path: TapQR.apk
