name: Build TapQR APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: AKS-Labs/CircleToSearch
          ref: 6ff6e513da8767b2e776add5625d1b89ce091286
          path: upstream
      - run: cp -r app/src/. upstream/app/src/
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - working-directory: upstream
        run: bash gradlew :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: TapQR-arm64
          path: upstream/app/build/outputs/apk/debug/*arm64-v8a*.apk
          if-no-files-found: error
